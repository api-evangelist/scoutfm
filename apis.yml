name: Scout.fm
description: >-
  Scout.fm (Scout FM) was a podcast-curation startup whose iOS, Android, Alexa
  and CarPlay apps turned podcasts into personalized, radio-like stations using
  AI-driven recommendations across genres such as news, sports and true crime.
  Backed by Bloomberg Beta, Precursor Ventures, Advancit Capital and Samsung
  NEXT (roughly $1.4M raised), the company was acquired by Apple in September
  2020 and subsequently shut down, with its apps pulled from every platform. The
  scout.fm domain no longer resolves and the company publishes no developer,
  API, or SDK surface. This profile is retained as a historical network record;
  there is nothing left to enrich.
